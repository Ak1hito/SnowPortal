{% extends 'catalog/base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<h2 class="mb-4">Вход</h2>
<div class="card p-4 mx-auto" style="max-width: 400px; border-radius: 18px;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Войти</button>
    </form>
    <p class="mt-3 text-center">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</div>
{% endblock %}
