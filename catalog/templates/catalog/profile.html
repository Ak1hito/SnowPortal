{% extends 'catalog/base.html' %}
{% block title %}Профиль{% endblock %}
{% block content %}
<h2 class="mb-4">Профиль</h2>
<div class="card p-4" style="border-radius: 18px; max-width: 500px;">
    <p><strong>Имя пользователя:</strong> {{ user.username }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Рост:</strong> {{ profile.height|default:"не указан" }} см</p>
    <p><strong>Вес:</strong> {{ profile.weight|default:"не указан" }} кг</p>
    <a href="{% url 'profile_edit' %}" class="btn btn-outline-dark mt-2">Редактировать</a>
</div>
{% endblock %}
